<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HockeySub - Hockey Substitution Scheduler{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .schedule-table {
            font-size: 0.8rem;
        }
        .schedule-table .active-cell {
            background-color: #28a745 !important;
            color: white !important;
            font-weight: bold !important;
        }
        .schedule-table .bench-cell {
            background-color: #dc3545 !important;
            color: white !important;
            font-weight: bold !important;
        }
        .schedule-cell {
            text-align: center;
            padding: 0.25rem;
            border: 1px solid #dee2e6;
            font-size: 1.2rem;
            font-weight: bold;
            vertical-align: middle;
        }
        .active-cell {
            background-color: #28a745 !important;
            color: white !important;
            font-weight: bold;
        }
        .bench-cell {
            background-color: #dc3545 !important;
            color: white !important;
        }
        .time-header {
            background-color: #f8f9fa;
            font-weight: bold;
            text-align: center;
            min-width: 120px;
            font-size: 0.75rem;
            vertical-align: middle;
        }
        .player-name {
            font-weight: bold;
            background-color: #f8f9fa;
            min-width: 120px;
        }
        .summary-cell {
            background-color: #e9ecef;
            font-weight: bold;
            text-align: center;
        }
        .validation-error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .validation-success {
            background-color: #d4edda;
            color: #155724;
        }
        @media print {
            @page { size: A4 landscape; margin: 10mm; }

            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

            .no-print { display: none !important; }
            nav.navbar { display: none !important; }
            .alert { display: none !important; }

            /* Full width, no bootstrap container constraints */
            body { margin: 0 !important; padding: 0 !important; }
            .container { margin: 0 !important; padding: 0 !important; max-width: 100% !important; width: 100% !important; }
            .mt-4 { margin-top: 0 !important; }

            /* Compact metadata: show as a single line strip, not two cards */
            .print-meta-cards { display: none !important; }
            .print-meta-strip { display: flex !important; }

            /* Schedule card takes all space */
            .card { border: none !important; box-shadow: none !important; }
            .card-header { background: none !important; padding: 2px 0 4px 0 !important; border-bottom: 1px solid #999 !important; }
            .card-body { padding: 4px 0 !important; }

            /* Legend card: hide or make tiny */
            .print-hide { display: none !important; }

            /* Table fits page */
            .table-responsive { overflow: visible !important; }
            .schedule-table { font-size: 0.62rem !important; width: 100% !important; table-layout: auto; }
            .time-header { min-width: 0 !important; padding: 2px 3px !important; font-size: 0.58rem !important; }
            .player-name { min-width: 0 !important; padding: 2px 4px !important; white-space: nowrap; }
            .schedule-cell { padding: 2px !important; font-size: 0.75rem !important; }
            .summary-cell { padding: 2px 3px !important; font-size: 0.58rem !important; white-space: nowrap; }

            /* Keep colors */
            .active-cell, .schedule-table .active-cell { background-color: #28a745 !important; color: white !important; }
            .bench-cell, .schedule-table .bench-cell { background-color: #dc3545 !important; color: white !important; }
            .validation-success { background-color: #d4edda !important; color: #155724 !important; }
            .validation-error { background-color: #f8d7da !important; color: #721c24 !important; }
            .summary-cell { background-color: #e9ecef !important; }
            .time-header, .player-name { background-color: #f8f9fa !important; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'hockeysub:index' %}">🏒 HockeySub</a>
            <div class="navbar-nav me-auto">
                {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'hockeysub:index' %}">Home</a>
                    <a class="nav-link" href="{% url 'hockeysub:create_game' %}">New Game</a>
                    <a class="nav-link" href="{% url 'hockeysub:game_list' %}">All Games</a>
                {% endif %}
            </div>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">{{ user.username }}</span>
                    <a class="nav-link" href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Login</a>
                    <a class="nav-link" href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
